name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t coral:ci .

      - name: Run container
        run: docker run -d -p 8000:8000 --name coral-test coral:ci

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          echo "App failed to become healthy in time"
          docker logs coral-test
          exit 1

      - name: Hit /health endpoint
        run: curl -sf http://localhost:8000/health

      - name: Hit /predict endpoint (smoke test real inference)
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"You won a free prize! Claim now."}'

      - name: Show logs on failure
        if: failure()
        run: docker logs coral-test

      - name: Stop container
        if: always()
        run: docker stop coral-test && docker rm coral-test